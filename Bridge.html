<!DOCTYPE html><html><head><meta charset="utf-8"></head><body><script>
(function(){
'use strict';
const origin=<?!= JSON.stringify(allowedOrigin) ?>;
const channel=<?!= JSON.stringify(channel) ?>;
const allowed=new Set(['ping','getData','saveAccount','deleteAccount','savePost','deletePost','react','uploadImage']);
function reply(payload){window.top.postMessage(Object.assign({projectSocialBridge:true,channel:channel},payload),origin);}
window.addEventListener('message',function(event){
  if(event.source!==window.top || event.origin!==origin)return;
  const msg=event.data;
  if(!msg || msg.projectSocialRequest!==true || msg.channel!==channel ||
     typeof msg.id!=='string' || !allowed.has(msg.fn) ||
     !Array.isArray(msg.args))return;
  try {
    const runner=google.script.run.withSuccessHandler(function(value){reply({id:msg.id,ok:true,value:value});})
      .withFailureHandler(function(err){reply({id:msg.id,ok:false,error:err&&err.message||String(err)});});
    runner[msg.fn].apply(runner,msg.args);
  } catch(err){reply({id:msg.id,ok:false,error:err.message||String(err)});}
});
reply({ready:true});
})();
</script></body></html>
